<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APPS - Two-Factor Authentication</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  (function(){
    var t = localStorage.getItem('apps_theme');
    if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
</head>
<body class="login-page">
<div class="wrap">
  <div class="auth-box fade-in" style="max-width: 440px;">
    <div class="auth-header">
      <div class="brand-link" style="justify-content:center; margin-bottom:12px;">
        <div class="mark">APPS</div>
      </div>
      <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:50%; background:rgba(30,58,138,0.1); color:var(--primary); margin:0 auto 12px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h2>Two-Factor Challenge</h2>
      <p style="font-size:13px; color:var(--steel); margin-top:4px;">
        Identity Verification for <strong>{{ user_name }}</strong> ({{ user_role|capitalize }})
      </p>
    </div>

    {% if error %}
    <div class="alert alert-danger" style="margin-bottom:18px; padding:12px 14px; font-size:13px; border-radius:8px; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;">
      <strong>Verification Failed:</strong> {{ error }}
    </div>
    {% endif %}

    <div style="background:var(--bg-alt, rgba(0,0,0,0.02)); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:18px; text-align:center;">
      <p style="margin:0; font-size:12.5px; color:var(--steel-deep); line-height:1.5;">
        Open your <strong>Google Authenticator</strong> or compatible TOTP app and enter the current 6-digit security passkey.
      </p>
    </div>

    <form method="POST" action="/login/2fa" autocomplete="off">
      <div class="field" style="margin-bottom:20px;">
        <label for="totp_code" style="font-size:12.5px; font-weight:700; color:var(--ink); display:block; margin-bottom:8px; text-align:center;">
          6-DIGIT SECURITY PASSKEY
        </label>
        <input type="text"
               id="totp_code"
               name="totp_code"
               maxlength="6"
               pattern="[0-9]*"
               inputmode="numeric"
               placeholder="000000"
               autofocus
               required
               style="text-align:center; font-size:24px; font-weight:800; letter-spacing:0.35em; font-family:monospace; padding:12px 16px; width:100%; box-sizing:border-box; border:2px solid var(--primary); border-radius:10px;">
      </div>

      <button type="submit" class="btn" style="width:100%; padding:14px; font-size:14px; font-weight:700;">
        Verify &amp; Proceed to Dashboard &rarr;
      </button>

      <div style="text-align:center; margin-top:18px;">
        <a href="/login" style="font-size:12.5px; color:var(--steel); text-decoration:none;">
          &larr; Cancel and return to sign in
        </a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
