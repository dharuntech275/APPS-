<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APPS - Unit Breakdown</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  (function(){
    var t = localStorage.getItem('apps_theme');
    if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
</head>
<body class="admin-page">
<div class="wrap">

  {% include "_header.html" %}

  <h2 class="page-title">Unit-Wise Breakdown</h2>

  <div class="card">
  {% if unit_summary %}
  <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap:18px; margin-top:8px;">
    {% for unit, counts in unit_summary.items() %}
    <div class="unit-summary-tile" onclick="window.location='{{ url_for('admin_unit_detail', unit_name=unit) }}'">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <strong style="font-family:'Helvetica Neue', Arial, sans-serif; font-size:14.5px;">{{ unit }}</strong>
        <span style="font-family:'Helvetica Neue', Arial, sans-serif; font-size:11.5px; background:var(--paper); padding:4px 10px; border-radius:12px; color:var(--steel);">{{ counts.total }} personnel</span>
      </div>

      <div style="display:flex; justify-content:space-between; text-align:center; font-family:'Helvetica Neue', Arial, sans-serif;">
        <div>
          <div style="color:var(--signal-high); font-weight:700; font-size:16px;">{{ counts.High }}</div>
          <div style="font-size:10px; color:var(--steel);">HIGH</div>
        </div>
        <div>
          <div style="color:var(--signal-med); font-weight:700; font-size:16px;">{{ counts.Medium }}</div>
          <div style="font-size:10px; color:var(--steel);">MEDIUM</div>
        </div>
        <div>
          <div style="color:var(--signal-low); font-weight:700; font-size:16px;">{{ counts.Low }}</div>
          <div style="font-size:10px; color:var(--steel);">LOW</div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  {% else %}
    <p class="empty-note">No personnel data yet.</p>
  {% endif %}
  </div>

</div>
</body>
</html>
