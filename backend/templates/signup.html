<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>APPS - Account Registration</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=25.0">
<script>
  (function(){
    var t = localStorage.getItem('apps_theme');
    if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<style>
  /* Auth Header & Spacious Desktop Layout */
  .auth-top-nav {
    width: 100% !important;
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    justify-content: space-between !important;
    align-items: center !important;
    box-sizing: border-box !important;
    padding: 16px 36px !important;
  }
  .auth-nav-left {
    display: inline-flex !important;
    align-items: center !important;
    gap: 12px !important;
    flex: 0 0 auto !important;
  }
  .auth-nav-right {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    margin-left: auto !important;
    flex: 0 0 auto !important;
  }
  .auth-wrapper {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 100% !important;
    min-height: calc(100vh - 80px) !important;
    padding: 30px 16px 60px !important;
    box-sizing: border-box !important;
    margin: 0 auto !important;
  }
  .auth-card.modern-auth-card {
    width: 100% !important;
    max-width: 540px !important;
    margin: 0 auto !important;
    padding: 44px 42px !important;
    border-radius: 26px !important;
    box-sizing: border-box !important;
  }
  .auth-form {
    gap: 20px !important;
  }
  .auth-field-group {
    gap: 8px !important;
    margin-bottom: 4px !important;
  }
  .auth-card.modern-auth-card .role-tabs,
  .modern-auth-card .role-tabs {
    margin: 20px 0 28px !important;
    padding: 6px !important;
    border-radius: 16px !important;
    gap: 8px !important;
  }
  .auth-card.modern-auth-card .role-tab,
  .modern-auth-card .role-tab {
    height: 44px !important;
    font-size: 13.5px !important;
    font-weight: 700 !important;
    border-radius: 12px !important;
    padding: 0 16px !important;
  }
  .auth-card.modern-auth-card .auth-input-container,
  .modern-auth-card .auth-input-container {
    height: 52px !important;
    min-height: 52px !important;
  }
  .auth-card.modern-auth-card input.auth-text-input,
  .modern-auth-card input.auth-text-input {
    height: 52px !important;
    min-height: 52px !important;
    line-height: 52px !important;
    padding: 0 48px 0 46px !important;
    font-size: 14.5px !important;
    border-radius: 14px !important;
  }
  #securityKeyGroup {
    padding: 18px 20px !important;
    border-radius: 16px !important;
    margin: 22px 0 10px !important;
  }
  .auth-submit-btn {
    height: 52px !important;
    font-size: 15.5px !important;
    font-weight: 800 !important;
    border-radius: 14px !important;
    margin-top: 10px !important;
  }

  /* Precision Mobile Layout (<= 640px) — Compact, Native & Perfectly Proportioned */
  @media (max-width: 640px) {
    .auth-top-nav {
      padding: 10px 14px !important;
    }
    .auth-wrapper {
      padding: 10px 14px 24px !important;
      min-height: calc(100vh - 65px) !important;
    }
    .auth-card.modern-auth-card {
      padding: 20px 18px 18px !important;
      border-radius: 20px !important;
      max-width: 100% !important;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08) !important;
    }
    .auth-card-header {
      margin-bottom: 12px !important;
      text-align: center !important;
    }
    .auth-title {
      font-size: 20px !important;
      font-weight: 800 !important;
      margin: 0 0 3px !important;
    }
    .auth-subtitle {
      font-size: 12px !important;
      line-height: 1.35 !important;
      margin: 0 !important;
      color: var(--steel) !important;
    }
    .auth-card.modern-auth-card .role-tabs,
    .modern-auth-card .role-tabs {
      margin: 10px 0 14px !important;
      padding: 4px !important;
      border-radius: 12px !important;
      gap: 6px !important;
    }
    .auth-card.modern-auth-card .role-tab,
    .modern-auth-card .role-tab {
      height: 38px !important;
      font-size: 12.5px !important;
      font-weight: 700 !important;
      border-radius: 8px !important;
      padding: 0 10px !important;
      gap: 6px !important;
    }
    .auth-form {
      gap: 11px !important;
    }
    .auth-field-group {
      gap: 4px !important;
      margin-bottom: 0 !important;
    }
    .auth-field-label {
      font-size: 11px !important;
      font-weight: 700 !important;
      letter-spacing: 0.03em !important;
    }
    .auth-card.modern-auth-card .auth-input-container,
    .modern-auth-card .auth-input-container {
      height: 44px !important;
      min-height: 44px !important;
    }
    .auth-card.modern-auth-card input.auth-text-input,
    .modern-auth-card input.auth-text-input {
      height: 44px !important;
      min-height: 44px !important;
      line-height: 44px !important;
      padding: 0 38px 0 36px !important;
      font-size: 13.5px !important;
      border-radius: 11px !important;
    }
    .auth-input-icon {
      left: 11px !important;
      width: 15px !important;
      height: 15px !important;
    }
    .auth-eye-btn {
      right: 8px !important;
      width: 28px !important;
      height: 28px !important;
    }
    #securityKeyGroup {
      padding: 12px 14px !important;
      border-radius: 12px !important;
      margin: 10px 0 6px !important;
    }
    .auth-submit-btn {
      height: 44px !important;
      min-height: 44px !important;
      font-size: 14px !important;
      font-weight: 700 !important;
      border-radius: 11px !important;
      margin-top: 6px !important;
      margin-bottom: 0 !important;
    }
    .auth-switch-row {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 5px !important;
      margin-top: 10px !important;
      font-size: 12px !important;
      white-space: nowrap !important;
    }
  }
</style>
</head>
<body class="auth-page-body">

<!-- Ambient Mesh Glow Background -->
<div class="auth-mesh-bg">
  <div class="auth-mesh-orb auth-orb-1"></div>
  <div class="auth-mesh-orb auth-orb-2"></div>
  <div class="auth-mesh-orb auth-orb-3"></div>
</div>

<!-- Modern Top Navigation Bar -->
<header class="auth-top-nav" style="width:100% !important; display:flex !important; flex-direction:row !important; flex-wrap:nowrap !important; justify-content:space-between !important; align-items:center !important; box-sizing:border-box !important;">
  <div class="auth-nav-left" style="display:inline-flex !important; align-items:center !important; gap:12px !important; flex:0 0 auto !important;">
    <a href="/" class="auth-portal-link" title="Return to Website Overview">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Website</span>
    </a>
    <span class="auth-nav-divider"></span>
    <a href="/" class="auth-brand-badge" style="text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
      <span class="brand-shield-icon-sm">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </span>
      <span class="brand-text">APPS</span>
    </a>
  </div>

  <div class="auth-nav-right" style="display:inline-flex !important; align-items:center !important; justify-content:flex-end !important; margin-left:auto !important; flex:0 0 auto !important;">
    <button type="button" class="theme-toggle auth-theme-btn" aria-label="Toggle dark mode" title="Toggle dark/light mode">
      <span class="theme-toggle-icon">
        <svg class="theme-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="theme-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </button>
  </div>
</header>

<!-- Focused Centered Auth Shell -->
<main class="auth-wrapper" style="justify-content:center; padding:30px 16px 60px;">
  <div style="width:100%; max-width:540px; margin:0 auto;">

    <div class="auth-card modern-auth-card">
      <div class="card-glow-top"></div>

      <div class="auth-card-header" style="text-align:center; margin-bottom:20px;">
        <h1 class="auth-title" id="formTitle" style="text-align:center; font-size:26px; margin:0 0 6px;">Personnel Sign Up</h1>
        <p class="auth-subtitle" style="text-align:center;">Select your role and enter your details to create an account.</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-tabs" id="roleTabs" style="margin:16px 0 20px;">
        <button type="button" class="role-tab active" data-role="personnel" onclick="switchRole('personnel')">
          <svg class="role-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
          <span>Personnel</span>
        </button>
        <button type="button" class="role-tab" data-role="officer" onclick="switchRole('officer')">
          <svg class="role-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Officer</span>
        </button>
        <button type="button" class="role-tab" data-role="admin" onclick="switchRole('admin')">
          <svg class="role-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Admin</span>
        </button>
      </div>

      {% if error %}
        <div class="auth-alert-box alert-error">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div>{{ error }}</div>
        </div>
      {% endif %}

      <form method="POST" action="/signup" onsubmit="return validateSignup(this);" class="auth-form">
        <input type="hidden" name="role" id="roleInput" value="{{ active_role or 'personnel' }}">

        <!-- Field: Name -->
        <div class="auth-field-group">
          <label class="auth-field-label" for="signupName">
            <span>Registered Full Name</span>
          </label>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="signupName" name="name" class="auth-text-input" value="{{ name or request.args.get('name', '') }}" placeholder="Enter full name" required autofocus autocomplete="name">
          </div>
        </div>

        <!-- Field: Unit / Department -->
        <div class="auth-field-group">
          <label class="auth-field-label" id="unitLabel" for="unitInput">
            <span>Department / Team / Unit</span>
          </label>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            </span>
            <input type="text" name="unit" id="unitInput" class="auth-text-input" placeholder="e.g. Operations / Engineering" required>
          </div>
        </div>

        <!-- Field: Password -->
        <div class="auth-field-group">
          <label class="auth-field-label" for="signupPassword">
            <span>Password (min 8 characters)</span>
          </label>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" name="password" id="signupPassword" class="auth-text-input" minlength="8" placeholder="Min 8 characters (letters &amp; numbers)" required autocomplete="new-password">
            <button type="button" class="pwd-toggle-btn auth-eye-btn" onclick="togglePasswordVisibility('signupPassword', this)" aria-label="Toggle password visibility" title="Show / Hide Password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Field: Confirm Password -->
        <div class="auth-field-group">
          <label class="auth-field-label" for="signupConfirmPassword">
            <span>Confirm Password</span>
          </label>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
            <input type="password" name="confirm_password" id="signupConfirmPassword" class="auth-text-input" minlength="8" placeholder="Re-enter password" required autocomplete="new-password">
            <button type="button" class="pwd-toggle-btn auth-eye-btn" onclick="togglePasswordVisibility('signupConfirmPassword', this)" aria-label="Toggle confirm password visibility" title="Show / Hide Password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div id="pwMatchStatus" style="font-size:12px; margin:-4px 0 14px; min-height:18px;"></div>

        <!-- Role Security Clearance Key Field (Officer & Admin only) -->
        <div id="securityKeyGroup" style="display:none; margin-bottom:18px; padding:12px 14px; border-radius:12px; background:rgba(239,68,68,0.06); border:1px solid rgba(239,68,68,0.25);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label id="securityKeyLabel" style="margin:0; font-weight:700; font-size:12.5px; color:#b91c1c;">Authorization Security Passkey</label>
            <span style="font-size:10px; font-weight:800; color:#dc2626; text-transform:uppercase; letter-spacing:0.05em; background:rgba(220,38,38,0.12); padding:2px 7px; border-radius:12px;">Clearance Required</span>
          </div>
          <div class="auth-input-container" style="margin-bottom:6px;">
            <span class="auth-input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" name="security_key" id="securityKeyInput" class="auth-text-input" placeholder="Enter confidential clearance key">
            <button type="button" class="pwd-toggle-btn auth-eye-btn" onclick="togglePasswordVisibility('securityKeyInput', this)" aria-label="Toggle passkey visibility" title="Show / Hide Passkey">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p id="securityKeyHelp" style="margin:0; font-size:11.5px; color:var(--steel); line-height:1.4;">
            Confidential Department Passkey is mandatory to activate this privileged role.
          </p>
        </div>

        <button type="submit" class="auth-submit-btn" id="submitBtn">
          <span>Register as Personnel</span>
          <svg class="submit-arrow-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="auth-switch-row" style="margin-top:20px;">
        <span>Already have an account?</span>
        <a href="/login" class="auth-switch-link">Sign In Here &rarr;</a>
      </div>

    </div>
  </div>
</main>

<script>
  var roleData = {
    personnel: {
      pill: 'APPS • PERSONNEL',
      title: 'Personnel Sign Up',
      unitLabel: 'Department / Team / Unit',
      unitPlaceholder: 'e.g. Operations / Alpha / Engineering',
      btnText: 'Register as Personnel'
    },
    officer: {
      pill: 'APPS • OFFICER',
      title: 'Officer Sign Up',
      unitLabel: 'Department / Station / Team',
      unitPlaceholder: 'e.g. Welfare / Operations / HR Lead',
      btnText: 'Register as Officer'
    },
    admin: {
      pill: 'APPS • ADMIN',
      title: 'Admin Sign Up',
      unitLabel: 'Organization / Department / HQ',
      unitPlaceholder: 'e.g. Operations Command / Management',
      btnText: 'Register as Admin'
    }
  };

  function validateSignup(form) {
    var name = (form.name ? form.name.value : '').trim();
    var unit = (form.unit ? form.unit.value : '').trim();
    var pwd = form.password ? form.password.value : '';
    var cpwd = form.confirm_password ? form.confirm_password.value : '';
    if (!name || !unit || !pwd || !cpwd) {
      alert("All fields are mandatory. Please provide all details to register.");
      return false;
    }
    if (pwd !== cpwd) {
      alert("Passwords do not match. Please re-enter your password accurately.");
      return false;
    }
    return true;
  }

  function switchRole(role) {
    if (!roleData[role]) role = 'personnel';
    var d = roleData[role];

    // Update active tab buttons
    document.querySelectorAll('.role-tab').forEach(function(tab) {
      if (tab.getAttribute('data-role') === role) {
        tab.classList.add('active');
      } else {
        tab.classList.remove('active');
      }
    });

    // Update hidden form input
    document.getElementById('roleInput').value = role;

    // Update UI text and placeholders
    var bp = document.getElementById('brandPill');
    if (bp) bp.innerHTML = d.pill;
    document.getElementById('formTitle').textContent = d.title;
    document.getElementById('unitLabel').textContent = d.unitLabel;
    document.getElementById('unitInput').placeholder = d.unitPlaceholder;
    var btnSpan = document.querySelector('#submitBtn span');
    if (btnSpan) btnSpan.textContent = d.btnText;
    else document.getElementById('submitBtn').textContent = d.btnText;

    // Toggle Role Security Passkey visibility & requirement
    var secGroup = document.getElementById('securityKeyGroup');
    var secInput = document.getElementById('securityKeyInput');
    var secLabel = document.getElementById('securityKeyLabel');
    var secHelp = document.getElementById('securityKeyHelp');
    if (role === 'officer') {
      secGroup.style.display = 'block';
      secInput.required = true;
      secLabel.textContent = 'Welfare Officer Authorization Key';
      secInput.placeholder = 'Enter Officer Clearance Key (e.g. OFFICER2026)';
      secHelp.innerHTML = 'Confidential clearance key issued by Department Headquarters is required to register as Welfare Officer.';
    } else if (role === 'admin') {
      secGroup.style.display = 'block';
      secInput.required = true;
      secLabel.textContent = 'Senior Admin Security Passkey';
      secInput.placeholder = 'Enter Admin Command Passkey (e.g. ADMIN2026)';
      secHelp.innerHTML = 'Confidential master command passkey is required to register as Senior Admin.';
    } else {
      secGroup.style.display = 'none';
      secInput.required = false;
      secInput.value = '';
    }

    // Update URL query string smoothly
    try {
      var url = new URL(window.location);
      url.searchParams.set('role', role);
      window.history.replaceState({}, '', url);
    } catch(e) {}
  }

  var EYE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  function togglePasswordVisibility(id, btn) {
    var inp = document.getElementById(id);
    if (!inp) return;
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.innerHTML = EYE_OFF_SVG;
      btn.title = 'Hide Password';
    } else {
      inp.type = 'password';
      btn.innerHTML = EYE_SVG;
      btn.title = 'Show Password';
    }
  }

  // Real-time password match validation
  var pwInput = document.getElementById('signupPassword');
  var confInput = document.getElementById('signupConfirmPassword');
  var matchStatus = document.getElementById('pwMatchStatus');
  var signupForm = document.querySelector('form');

  function checkPasswordMatch() {
    if (!confInput.value) {
      matchStatus.innerHTML = '';
      return true;
    }
    if (pwInput.value !== confInput.value) {
      matchStatus.innerHTML = '<span style="color:var(--signal-high); display:inline-flex; align-items:center; gap:5px; font-weight:600;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Passwords do not match</span>';
      return false;
    } else {
      matchStatus.innerHTML = '<span style="color:var(--signal-low); display:inline-flex; align-items:center; gap:5px; font-weight:600;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Passwords match</span>';
      return true;
    }
  }

  pwInput.addEventListener('input', checkPasswordMatch);
  confInput.addEventListener('input', checkPasswordMatch);

  signupForm.addEventListener('submit', function(e) {
    if (pwInput.value !== confInput.value) {
      e.preventDefault();
      matchStatus.innerHTML = '<span style="color:var(--signal-high); font-weight:700;">Passwords do not match. Please verify your password before submitting.</span>';
      confInput.focus();
      return;
    }
    var currentRole = document.getElementById('roleInput').value;
    var secInput = document.getElementById('securityKeyInput');
    if ((currentRole === 'officer' || currentRole === 'admin') && secInput && !secInput.value.trim()) {
      e.preventDefault();
      secInput.focus();
      alert("Security passkey is required to register as " + currentRole.toUpperCase() + ".");
      return;
    }
  });

  // Initialize on page load
  (function initRole() {
    var params = new URLSearchParams(window.location.search);
    var initial = params.get('role') || '{{ active_role or "personnel" }}';
    switchRole(initial);
  })();

  // Theme Toggle Handler
  (function(){
    document.querySelectorAll('.theme-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('apps_theme', isDark ? 'dark' : 'light');
      });
    });
  })();
</script>
</body>
</html>
