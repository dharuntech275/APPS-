<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APPS - Account Registration</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  (function(){
    var t = localStorage.getItem('apps_theme');
    if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
</head>
<body>

<div class="auth-theme-toggle-wrap">
  <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <span class="theme-toggle-icon">
      <svg class="theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="theme-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </span>
  </button>
</div>

<div class="auth-shell">

  <div class="auth-form-panel">
    <div class="auth-card">
      <div class="brand" id="brandPill">APPS <span>•</span> PERSONNEL</div>
      <h1 id="formTitle">Personnel Sign Up</h1>
      <p class="sub">Select your role and enter your details to create an account.</p>

      <!-- Role Selector Tabs -->
      <div class="role-tabs" id="roleTabs">
        <button type="button" class="role-tab active" data-role="personnel" onclick="switchRole('personnel')"><svg class="role-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Member / Personnel</button>
        <button type="button" class="role-tab" data-role="officer" onclick="switchRole('officer')"><svg class="role-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Counselor / Officer</button>
        <button type="button" class="role-tab" data-role="admin" onclick="switchRole('admin')"><svg class="role-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Executive Admin</button>
      </div>

      {% if error %}
        <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/signup" onsubmit="return validateSignup(this);">
        <input type="hidden" name="role" id="roleInput" value="{{ active_role or 'personnel' }}">

        <label>Name</label>
        <input type="text" name="name" value="{{ name or request.args.get('name', '') }}" placeholder="Full Name" required autofocus>

        <label id="unitLabel">Department / Team / Unit</label>
        <input type="text" name="unit" id="unitInput" placeholder="e.g. Operations / Alpha / Engineering" required>

        <label>Password</label>
        <div class="pwd-input-wrap">
          <input type="password" name="password" id="signupPassword" minlength="8" placeholder="Minimum 8 characters (letters & numbers)" required>
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('signupPassword', this)" aria-label="Toggle password visibility" title="Show / Hide Password">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <label>Confirm Password</label>
        <div class="pwd-input-wrap" style="margin-bottom:8px;">
          <input type="password" name="confirm_password" id="signupConfirmPassword" minlength="8" placeholder="Re-enter your password to confirm" required>
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('signupConfirmPassword', this)" aria-label="Toggle confirm password visibility" title="Show / Hide Password">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div id="pwMatchStatus" style="font-size:12px; margin-bottom:14px; min-height:16px;"></div>

        <!-- Role Security Clearance Key Field (Officer & Admin only) -->
        <div id="securityKeyGroup" style="display:none; margin-bottom:20px; padding:12px 14px; border-radius:10px; background:rgba(239,68,68,0.06); border:1px solid rgba(239,68,68,0.25);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label id="securityKeyLabel" style="margin:0; font-weight:700; font-size:12.5px; color:#b91c1c;">Authorization Security Passkey</label>
            <span style="font-size:10px; font-weight:800; color:#dc2626; text-transform:uppercase; letter-spacing:0.05em; background:rgba(220,38,38,0.12); padding:2px 7px; border-radius:12px;">Clearance Required</span>
          </div>
          <div class="pwd-input-wrap" style="margin-bottom:6px;">
            <input type="password" name="security_key" id="securityKeyInput" placeholder="Enter confidential clearance key">
            <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('securityKeyInput', this)" aria-label="Toggle passkey visibility" title="Show / Hide Passkey">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p id="securityKeyHelp" style="margin:0; font-size:11.5px; color:var(--steel); line-height:1.4;">
            Confidential Department Passkey is mandatory to activate this privileged role.
          </p>
        </div>

        <button type="submit" class="btn" id="submitBtn">Register as Personnel</button>
      </form>

      <p class="foot-link">Already have an account? <a href="/login">Sign In Here</a></p>
    </div>
  </div>

</div>

<script>
  var roleData = {
    personnel: {
      pill: 'APPS • MEMBER / PERSONNEL',
      title: 'Team Member & Personnel Sign Up',
      brandTitle: 'Workforce & Team Wellbeing Network',
      brandSub: 'Register once to start your daily check-ins, track wellness trends, and access 24/7 confidential AI support.',
      unitLabel: 'Department / Team / Unit',
      unitPlaceholder: 'e.g. Operations / Alpha / Engineering',
      btnText: 'Register as Member'
    },
    officer: {
      pill: 'APPS • COUNSELOR / OFFICER',
      title: 'Welfare Officer & Counselor Sign Up',
      brandTitle: 'Counselor & Officer Intelligence Portal',
      brandSub: 'Register your Counselor account to coordinate psychological monitoring, automated case briefs, and support requests.',
      unitLabel: 'Department / Station / Team',
      unitPlaceholder: 'e.g. Welfare / Operations / HR Lead',
      btnText: 'Register as Counselor'
    },
    admin: {
      pill: 'APPS • EXECUTIVE ADMIN',
      title: 'Executive Admin & Leadership Sign Up',
      brandTitle: 'Executive Administration Console',
      brandSub: 'Register your Executive Admin account to access organization-wide health metrics, 7-day burnout forecasts, and reports.',
      unitLabel: 'Organization / Department / HQ',
      unitPlaceholder: 'e.g. Operations Command / Management',
      btnText: 'Register as Executive Admin'
    }
  };

  function validateSignup(form) {
    var name = (form.name ? form.name.value : '').trim();
    var unit = (form.unit ? form.unit.value : '').trim();
    var pwd = form.password ? form.password.value : '';
    var cpwd = form.confirm_password ? form.confirm_password.value : '';
    if (!name || !unit || !pwd || !cpwd) {
      alert("All fields are mandatory. Please provide all details to register.");
      return false;
    }
    if (pwd !== cpwd) {
      alert("Passwords do not match. Please re-enter your password accurately.");
      return false;
    }
    return true;
  }

  function switchRole(role) {
    if (!roleData[role]) role = 'personnel';
    var d = roleData[role];

    // Update active tab buttons
    document.querySelectorAll('.role-tab').forEach(function(tab) {
      if (tab.getAttribute('data-role') === role) {
        tab.classList.add('active');
      } else {
        tab.classList.remove('active');
      }
    });

    // Update hidden form input
    document.getElementById('roleInput').value = role;

    // Update UI text and placeholders
    document.getElementById('brandPill').innerHTML = d.pill.replace('•', '<span>•</span>');
    document.getElementById('formTitle').textContent = d.title;
    var bt = document.getElementById('brandTitle'); if (bt) bt.textContent = d.brandTitle;
    var bs = document.getElementById('brandSub'); if (bs) bs.textContent = d.brandSub;
    document.getElementById('unitLabel').textContent = d.unitLabel;
    document.getElementById('unitInput').placeholder = d.unitPlaceholder;
    document.getElementById('submitBtn').textContent = d.btnText;

    // Toggle Role Security Passkey visibility & requirement
    var secGroup = document.getElementById('securityKeyGroup');
    var secInput = document.getElementById('securityKeyInput');
    var secLabel = document.getElementById('securityKeyLabel');
    var secHelp = document.getElementById('securityKeyHelp');
    if (role === 'officer') {
      secGroup.style.display = 'block';
      secInput.required = true;
      secLabel.textContent = 'Welfare Officer Authorization Key';
      secInput.placeholder = 'Enter Officer Clearance Key (e.g. OFFICER2026)';
      secHelp.innerHTML = 'Confidential clearance key issued by Department Headquarters is required to register as Welfare Officer.';
    } else if (role === 'admin') {
      secGroup.style.display = 'block';
      secInput.required = true;
      secLabel.textContent = 'Senior Admin Security Passkey';
      secInput.placeholder = 'Enter Admin Command Passkey (e.g. ADMIN2026)';
      secHelp.innerHTML = 'Confidential master command passkey is required to register as Senior Admin.';
    } else {
      secGroup.style.display = 'none';
      secInput.required = false;
      secInput.value = '';
    }

    // Update URL query string smoothly
    try {
      var url = new URL(window.location);
      url.searchParams.set('role', role);
      window.history.replaceState({}, '', url);
    } catch(e) {}
  }

  var EYE_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  function togglePasswordVisibility(id, btn) {
    var inp = document.getElementById(id);
    if (!inp) return;
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.innerHTML = EYE_OFF_SVG;
      btn.title = 'Hide Password';
    } else {
      inp.type = 'password';
      btn.innerHTML = EYE_SVG;
      btn.title = 'Show Password';
    }
  }

  // Real-time password match validation
  var pwInput = document.getElementById('signupPassword');
  var confInput = document.getElementById('signupConfirmPassword');
  var matchStatus = document.getElementById('pwMatchStatus');
  var signupForm = document.querySelector('form');

  function checkPasswordMatch() {
    if (!confInput.value) {
      matchStatus.innerHTML = '';
      return true;
    }
    if (pwInput.value !== confInput.value) {
      matchStatus.innerHTML = '<span style="color:var(--signal-high); display:inline-flex; align-items:center; gap:5px; font-weight:600;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Passwords do not match</span>';
      return false;
    } else {
      matchStatus.innerHTML = '<span style="color:var(--signal-low); display:inline-flex; align-items:center; gap:5px; font-weight:600;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Passwords match</span>';
      return true;
    }
  }

  pwInput.addEventListener('input', checkPasswordMatch);
  confInput.addEventListener('input', checkPasswordMatch);

  signupForm.addEventListener('submit', function(e) {
    if (pwInput.value !== confInput.value) {
      e.preventDefault();
      matchStatus.innerHTML = '<span style="color:var(--signal-high); font-weight:700;">Passwords do not match. Please verify your password before submitting.</span>';
      confInput.focus();
      return;
    }
    var currentRole = document.getElementById('roleInput').value;
    var secInput = document.getElementById('securityKeyInput');
    if ((currentRole === 'officer' || currentRole === 'admin') && secInput && !secInput.value.trim()) {
      e.preventDefault();
      secInput.focus();
      alert("Security passkey is required to register as " + currentRole.toUpperCase() + ".");
      return;
    }
  });

  // Initialize on page load
  (function initRole() {
    var params = new URLSearchParams(window.location.search);
    var initial = params.get('role') || '{{ active_role or "personnel" }}';
    switchRole(initial);
  })();

  // Theme Toggle Handler
  (function(){
    document.querySelectorAll('.theme-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('apps_theme', isDark ? 'dark' : 'light');
      });
    });
  })();
</script>

</body>
</html>
